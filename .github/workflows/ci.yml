name: CI

on:
  push:
    branches: [dev]
    paths-ignore: &docs
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, dev]
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    container: node:24

    env:
      DB_NAME: funkyseats
      DB_USER: funkyseats
      DB_PASSWORD: ci_password
      DB_TEST_NAME: funkyseats_test
      DB_TEST_HOST: test-db
      DB_TEST_PORT: 3306

    services:
      test-db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: funkyseats_test
          MYSQL_USER: funkyseats
          MYSQL_PASSWORD: ci_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:frontend
      - run: npm test
      - run: npm run test:integration
