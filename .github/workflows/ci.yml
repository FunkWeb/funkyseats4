name: CI

on:
  push:
    branches: [dev]
    paths-ignore: &docs
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, dev]
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DB_NAME: funkyseats
      DB_USER: funkyseats
      DB_PASSWORD: ci_password
      DB_TEST_NAME: funkyseats_test
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3307

    services:
      test-db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: funkyseats_test
          MYSQL_USER: funkyseats
          MYSQL_PASSWORD: ci_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:frontend
      - run: npm test
      - run: npm run test:integration
